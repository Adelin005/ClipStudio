<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ViralClip Studio — Video Social Media Generator</title>
  <meta name="description" content="Generate viral TikTok & Instagram Reels content with AI-powered clip mixing, text overlays, and custom music. Free, no copyright issues." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Premium background: subtle mesh gradient/noise -->
    <div class="bg-premium">
      <div class="bg-glow bg-glow-1"></div>
      <div class="bg-glow bg-glow-2"></div>
      <div class="bg-noise"></div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z"></path>
          <rect x="3" y="6" width="12" height="12" rx="2" ry="2"></rect>
        </svg>
        <span class="logo-text">ViralClip<span class="logo-accent">Studio</span></span>
      </div>

      <!-- User widget (filled by main.js) -->
      <div class="sidebar-user" id="sidebar-user" style="display:none;">
        <div class="user-avatar" id="user-avatar">U</div>
        <div class="user-info">
          <div class="user-name" id="user-name">User</div>
          <div class="user-plan-badge" id="user-plan-badge">🆓 Free</div>
        </div>
        <button class="user-upgrade-btn" id="btn-upgrade" title="Upgrade plan">⬆</button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Step 1 (Auto) -->
        <button class="nav-step nav-step-special active" data-step="1" id="nav-step-1">
          <div class="step-icon-box special">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          </div>
          <span class="step-label">Auto Generate</span>
        </button>

        <!-- Step 2 (History) -->
        <button class="nav-step" data-step="2" id="nav-step-2">
          <div class="step-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
          </div>
          <span class="step-label">Istoric Video</span>
        </button>

        <!-- API Settings (Mobile Only) -->
        <button class="nav-step mobile-settings-btn" id="nav-step-settings">
          <div class="step-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </div>
          <span class="step-label">Setări API</span>
        </button>
      </nav>

      <div class="sidebar-footer" id="sidebar-footer">
        <div class="api-keys-wrapper">
          <h4 class="api-keys-title">
            <div style="display:flex;align-items:center;gap:6px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
              Setări API
            </div>
            <button class="api-help-btn" id="btn-api-help" title="Cum obții cheile API gratuit?">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              Cum obții?
            </button>
          </h4>

          <!-- Pexels -->
          <div class="api-field-group">
            <label class="api-field-label">
              <span class="api-field-icon">🎬</span> Pexels API Key
            </label>
            <input type="password" id="pexels-api-key" placeholder="Cole_xxxxxxxxxxxxxxxx" class="form-input form-input-sm" />
          </div>

          <!-- Cloudflare -->
          <div class="api-field-group">
            <label class="api-field-label">
              <span class="api-field-icon">☁️</span> Cloudflare Account ID
            </label>
            <input type="password" id="cf-account-id" placeholder="a1b2c3d4e5f6..." class="form-input form-input-sm" />
          </div>
          <div class="api-field-group">
            <label class="api-field-label">
              <span class="api-field-icon">🔑</span> Cloudflare API Token
            </label>
            <input type="password" id="cf-api-token" placeholder="Bearer token..." class="form-input form-input-sm" />
          </div>

          <!-- Notice for Free users -->
          <div id="free-api-notice" style="display: none; flex-direction: column; gap: 8px; margin-top: 10px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 8px; padding: 12px; font-size: 12px; color: #10b981; line-height: 1.5;">
            <div style="font-weight: 700; display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 14px;">✨</span> Auto-configurat
            </div>
            Nu este nevoie de setări API. Folosești cheile platformei pentru videoclipul gratuit de astăzi.
          </div>

        </div>
        <button class="btn-logout" id="btn-logout" style="display:none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Deconectează-te
        </button>
        <p class="footer-text">ViralClip Studio • AI Video Generator</p>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
      <!-- Step panels are rendered dynamically -->
    </main>

    <!-- Toast notifications -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
